name: Tests

on:
  push:
    branches:
      - main
      - claude/build-mobile-app-EtCMg
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "platforms;android-35" >/dev/null 2>&1 || true

      - name: Run unit tests
        run: ./gradlew shared:domain:jvmTest shared:data:jvmTest shared:printing:jvmTest composeApp:jvmTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/jvmTest/**
            **/build/test-results/jvmTest/**
          if-no-files-found: ignore
          retention-days: 14
