name: Tests

on:
  push:
    branches:
      - main
      - claude/build-mobile-app-EtCMg
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "platforms;android-35" >/dev/null 2>&1 || true

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew shared:domain:jvmTest shared:data:jvmTest shared:printing:jvmTest composeApp:jvmTest --no-daemon --stacktrace 2>&1 | tee build-output.txt

      - name: Post failure details to PR
        if: steps.tests.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = 'No build output captured';
            try {
              const full = fs.readFileSync('build-output.txt', 'utf8');
              const lines = full.split('\n');
              const sections = [];
              const errorLines = lines.filter(l => /^e:|^w:.*error/i.test(l));
              if (errorLines.length > 0) sections.push('=== COMPILER ERRORS ===\n' + errorLines.join('\n'));
              for (let i = 0; i < lines.length; i++) {
                if (/^\* What went wrong/.test(lines[i])) {
                  sections.push('=== WHAT WENT WRONG ===\n' + lines.slice(i, i + 30).join('\n'));
                  break;
                }
              }
              const failLines = lines.filter(l => /FAILURE:|BUILD FAILED|Exception:|Caused by:.*[A-Z]/.test(l));
              if (failLines.length > 0) sections.push('=== FAILURE LINES ===\n' + failLines.join('\n'));
              sections.push('=== LAST 50 LINES ===\n' + lines.slice(-50).join('\n'));
              output = sections.join('\n\n');
            } catch (e) {
              output = `Error reading build output: ${e.message}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## CI Failure Details\n\`\`\`\n${output.slice(0, 60000)}\n\`\`\``
            });

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/jvmTest/**
            **/build/test-results/jvmTest/**
          if-no-files-found: ignore
          retention-days: 14
