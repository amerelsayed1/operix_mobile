services:
  postgres:
    image: postgres:16-alpine
    container_name: operix-mobile-postgres
    environment:
      POSTGRES_DB: operix
      POSTGRES_USER: operix
      POSTGRES_PASSWORD: operix_secret
    ports:
      # Host 5433 -> container 5432, to avoid clashing with a host-installed
      # PostgreSQL that may already own 5432. The Flutter app defaults to 5433.
      - "5433:5432"
    volumes:
      - operix_mobile_pg_data:/var/lib/postgresql/data
      - ./database/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operix -d operix"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  operix_mobile_pg_data:
